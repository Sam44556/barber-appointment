services:
  # ──────────────────────────────────────────────────────────
  # Backend — NestJS in watch mode (hot reload)
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder               # builder stage has all devDependencies
    container_name: barber_backend_dev
    working_dir: /app
    command: sh -c "npx prisma generate && npm run start:dev"
    volumes:
      - ./backend/src:/app/src       # your local changes sync into container
      - ./backend/prisma:/app/prisma # prisma schema changes sync too
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    networks:
      - barber_net_dev

  # ──────────────────────────────────────────────────────────
  # Frontend — Vite dev server (hot reload)
  # ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder               # builder stage has node_modules + vite
    container_name: barber_frontend_dev
    working_dir: /app
    command: npm run dev
    volumes:
      - ./frontend/src:/app/src      # your local changes sync into container
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - barber_net_dev

# ──────────────────────────────────────────────────────────
# Shared dev network (separate from production)
# ──────────────────────────────────────────────────────────
networks:
  barber_net_dev:
    driver: bridge
