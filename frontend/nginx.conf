server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Performance: keep connections alive ────────────────────
    # Prevents the browser from opening a new TCP connection on every request
    keepalive_timeout 65;

    # ── Handle SPA routing ─────────────────────────────────────
    # All unknown routes fall back to index.html (React Router handles them)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets aggressively ─────────────────────
    # JS/CSS/images are hashed by Vite — safe to cache for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # ── Never cache index.html ────────────────────────────────
    # Ensures users always get the latest app version
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── Gzip compression ─────────────────────────────────────
    # Reduces file sizes sent over the network (faster load times)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml
        font/woff
        font/woff2;
}
