# ============================================================
# Secret — Backend sensitive environment variables
#
# ⚠️  DO NOT commit real values to Git.
#     Use Sealed Secrets or External Secrets Operator in CI/CD.
#
# To encode a value manually:
#   echo -n "your-value" | base64
#
# Or use stringData (Kubernetes encodes it automatically):
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: barber-app
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: barber-appointment
type: Opaque
stringData:
  # ⚠️ Replace all values below with your actual secrets
  DATABASE_URL: "postgresql://postgres.USER:PASSWORD@HOST:5432/postgres?sslmode=require"
  BETTER_AUTH_SECRET: "your-super-secret-key-at-least-32-chars"
  CLOUDINARY_CLOUD_NAME: "your-cloudinary-name"
  CLOUDINARY_API_KEY: "your-cloudinary-api-key"
  CLOUDINARY_API_SECRET: "your-cloudinary-api-secret"
