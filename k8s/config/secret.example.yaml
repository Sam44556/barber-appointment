# ============================================================
# Secret — Backend sensitive environment variables
#
# ⚠️  THIS IS THE EXAMPLE FILE — safe to commit to Git.
#     The REAL file (secret.yaml) is in .gitignore.
#
# HOW TO USE:
#   1. Copy this file:  cp secret.example.yaml secret.yaml
#   2. Fill in real values in secret.yaml
#   3. Apply to cluster: kubectl apply -f k8s/config/secret.yaml
#   4. NEVER commit secret.yaml — it is blocked by .gitignore
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: barber-app
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: barber-appointment
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/postgres?sslmode=require"
  BETTER_AUTH_SECRET: "replace-with-random-32-char-string"
  CLOUDINARY_CLOUD_NAME: "replace-with-your-cloud-name"
  CLOUDINARY_API_KEY: "replace-with-your-api-key"
  CLOUDINARY_API_SECRET: "replace-with-your-api-secret"
