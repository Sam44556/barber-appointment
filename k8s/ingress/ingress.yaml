# ============================================================
# Ingress — Routes external HTTPS traffic to frontend & backend
#
# Prerequisites (one-time cluster setup):
#   1. Nginx Ingress Controller:
#      kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.0/deploy/static/provider/cloud/deploy.yaml
#
#   2. cert-manager (for automatic Let's Encrypt TLS):
#      kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.0/cert-manager.yaml
#
#   3. DNS A records pointing both domains to your cluster's LoadBalancer IP:
#      yourdomain.com      → <LoadBalancer IP>
#      api.yourdomain.com  → <LoadBalancer IP>
#
# ⚠️ Replace "yourdomain.com" with your actual domain before applying.
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: barber-ingress
  namespace: barber-app
  labels:
    app.kubernetes.io/name: barber-ingress
    app.kubernetes.io/part-of: barber-appointment
  annotations:
    kubernetes.io/ingress.class: "nginx"

    # Automatic TLS via cert-manager + Let's Encrypt
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # ── Security headers ──────────────────────────────────────
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";

    # ── Performance ───────────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"   # Allow image uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

    # ── Rate limiting (protect the API) ───────────────────────
    nginx.ingress.kubernetes.io/limit-rps: "20"

    # CORS is handled by NestJS itself
    nginx.ingress.kubernetes.io/enable-cors: "false"

spec:
  # TLS — cert-manager provisions a free Let's Encrypt certificate
  tls:
    - hosts:
        - yourdomain.com      # ⚠️ Replace with your domain
        - api.yourdomain.com  # ⚠️ Replace with your API subdomain
      secretName: barber-tls-cert

  rules:
    # ── Frontend — React/Vite SPA served by Nginx ─────────────
    - host: yourdomain.com  # ⚠️ Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  name: http

    # ── Backend — NestJS REST API ─────────────────────────────
    - host: api.yourdomain.com  # ⚠️ Replace with your API subdomain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  name: http

---
# ============================================================
# ClusterIssuer — Let's Encrypt (Production)
# cert-manager uses this to issue & auto-renew TLS certificates.
# Apply AFTER cert-manager is installed.
# ============================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: barber-appointment
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: your-email@yourdomain.com  # ⚠️ Replace with your email
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx
