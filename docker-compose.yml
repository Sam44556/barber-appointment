services:
  # ──────────────────────────────────────────────────────────
  # Backend — NestJS + Prisma
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: barber_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - barber_net

  # ──────────────────────────────────────────────────────────
  # Frontend — React/Vite built & served by Nginx
  # ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: barber_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - barber_net

# ──────────────────────────────────────────────────────────
# Shared network
# ──────────────────────────────────────────────────────────
networks:
  barber_net:
    driver: bridge
